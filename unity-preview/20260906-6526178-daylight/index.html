<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#02070b">
    <title>魔刃行者 Unity 試玩版</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
        background: #02070b;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #02070b;
      }

      body {
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #unity-shell {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 30%, rgba(19, 99, 119, 0.28), transparent 48%),
          #02070b;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: #02070b;
        touch-action: none;
      }

      #loading,
      #fatal-error,
      #rotate-hint {
        position: absolute;
        z-index: 3;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        box-sizing: border-box;
        text-align: center;
        background: rgba(2, 7, 11, 0.92);
      }

      .loading-card {
        width: min(360px, 86vw);
      }

      .eyebrow {
        margin-bottom: 10px;
        color: #67e8f9;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0 0 8px;
        color: #e9fbff;
        font-size: clamp(28px, 8vw, 40px);
      }

      p {
        margin: 0;
        color: #9ab5bf;
        line-height: 1.55;
      }

      .track {
        height: 6px;
        margin: 24px 0 12px;
        overflow: hidden;
        border-radius: 99px;
        background: #0d2933;
      }

      #progress {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0891b2, #67e8f9);
        transition: width 120ms linear;
      }

      #percent {
        color: #dffaff;
        font-variant-numeric: tabular-nums;
      }

      #fatal-error,
      #rotate-hint {
        display: none;
      }

      #fatal-error button {
        margin-top: 20px;
        padding: 12px 20px;
        border: 1px solid #4bc6dd;
        border-radius: 999px;
        color: #e9fbff;
        background: #0a3c49;
        font: inherit;
        font-weight: 700;
      }

      @media (orientation: landscape) and (max-height: 600px) {
        #rotate-hint {
          display: flex;
          pointer-events: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="unity-shell">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>

      <section id="loading" aria-live="polite">
        <div class="loading-card">
          <div class="eyebrow">UNITY 手機試玩版</div>
          <h1>魔刃行者</h1>
          <p>正在召喚暴風神社……</p>
          <div class="track"><div id="progress"></div></div>
          <div id="percent">0%</div>
        </div>
      </section>

      <section id="fatal-error" role="alert">
        <div class="loading-card">
          <div class="eyebrow">載入失敗</div>
          <h1>無法進入神社</h1>
          <p id="fatal-message">請檢查網路後再試一次。</p>
          <button type="button" onclick="location.reload()">重新載入</button>
        </div>
      </section>

      <section id="rotate-hint">
        <div class="loading-card">
          <div class="eyebrow">建議直式遊玩</div>
          <h1>請轉回直式</h1>
          <p>斬擊區與移動區會更容易操作。</p>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#progress");
      const percent = document.querySelector("#percent");
      const fatalError = document.querySelector("#fatal-error");
      const fatalMessage = document.querySelector("#fatal-message");
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/fbddea23d36c170ad87ca0b6821dda29.loader.js";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/1cc3a4fe1feef79f9284ea0228cdb673.data.unityweb",
        frameworkUrl: buildUrl + "/b8890185abddb9b915a9e3a1f9275352.framework.js.unityweb",
        codeUrl: buildUrl + "/b3b3625844221329203386fbe76eda8b.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Long Studio",
        productName: "Blade Walker Remake",
        productVersion: "0.1.0",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: 1,
      };

      function fail(message) {
        loading.style.display = "none";
        fatalMessage.textContent = String(message || "請檢查網路後再試一次。");
        fatalError.style.display = "flex";
      }

      document.addEventListener("contextmenu", (event) => event.preventDefault());
      document.addEventListener("touchmove", (event) => event.preventDefault(), { passive: false });

      const loader = document.createElement("script");
      loader.src = loaderUrl;
      loader.onload = () => {
        createUnityInstance(canvas, config, (value) => {
          const valuePercent = Math.round(value * 100);
          progress.style.width = valuePercent + "%";
          percent.textContent = valuePercent + "%";
        }).then((instance) => {
          window.unityInstance = instance;
          loading.style.display = "none";
          canvas.focus();
        }).catch(fail);
      };
      loader.onerror = () => fail("Unity 載入器下載失敗，請確認網路後重試。");
      document.body.appendChild(loader);
    </script>
  </body>
</html>
